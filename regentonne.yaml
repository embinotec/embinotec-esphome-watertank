##   Water barrel
##
## ------Sensor / Lid---
## |       \/          |
## |                   = inlet | maximum level        ---
## |\/\/\/\/\/\/\/\/\/\| - Water level                 | full / green
## |                   |                              ---  
## |                   |                               | mid / yellow
## |                   |                              ---
## |                   |                               | empty / red
## |                   =, outlet | minimum level      ---
## |___________________| 
##
## 220 l Kunststofffass: Durchmesser 58.4cm, Höhe 93,5cm.
## 
## ------ SUBSTITUTIONS ------ 
substitutions:
  devicename: waterbarrel
  friendly_devicename: "Rain Water Barrel"
  device_description: "Water Barrel with ultrasonic sensor sensor"
  ##Distance between bottom of tank and lower edge of lip where sensor is attached.
  ##Edge lip bottom to the bottom of canisater is 96.5cm but sensor is a bit lower down so about 95cm?
  ##Value in cm as sensor readings are converted to cm right away
  distance_sensor_to_bottom: "91.5"

  ## levels in cm
  minimum_level: "15" ## where the outlet is assembled
  maximum_level: "85"

  #Set to 1hrs. Needs to be very long otherwise it overrides the frequency set in the main sensor
  update_interval_s: "3600s"
  #Only reason not to set it very long it for wifi troubleshooting
  update_interval_wifi: "60min"

  #Wie oft der Ultraschallsensor intern misst, WÄHREND das Gerät wach ist.
  #Muss deutlich kürzer als deep_sleep run_duration sein, sonst kommt kein
  #volles Moving-Average-Fenster zustande.
  ultrasonic_sample_interval: "5s"
  #Anzahl Rohmessungen, über die gemittelt wird, bevor ein Wert weitergegeben wird.
  moving_avg_window: "5"

  distance_calibration: "-0.085" #In meters. Must be the salt as outside the tank was more accurate

  min_brightness: 0
  the_brightness: "0.2"
  max_brightness: 255

 ##Fass-Geometrie für die Liter-Berechnung (Zylinder)
  tank_diameter_cm: "58.4"
  tank_radius_cm: "29.2"

## SUB:------ HARDWARE PINS------ 
  trigger: 33
  echo: 32

## ------ ESPHome HEADER -------
esphome:
  name: ${devicename}
  friendly_name: ${friendly_devicename}
  min_version: 2025.9.0
  name_add_mac_suffix: false
  comment: Distanzmessung zum Wasser gibt die Füllhöhe an.
  on_boot: 
    priority: 600
    then:
      - component.update: sensor_to_water_cm
      - if:
          condition:
            switch.is_on: disable_sleep_switch
          then:
            deep_sleep.prevent: deep_sleep_1
      

## ------ ESP32 configuration ------
## Please be aware of changing one of these configuration options could cause in uncompilable code.
esp32:
  #variant: esp32
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf

## ----- GLOBALS ------
globals:
#  - id: my_global_int
#    type: int
#    restore_value: no
#    initial_value: '0'

  - id: led_brightness
    type: float
    restore_value: yes
    initial_value: ${the_brightness}   # entspricht ca. 25/255

## ------ LOGGING ------
## Options: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE
logger:
  level: DEBUG
  #logs:
 #   lvgl: info


## ------ HOME ASSISTANT API ------
## To generate a new based64 32 byte code, go to https://generate-random.org/base64-string.
## Set byte-count to 32 and hit GENERATE. Copy it to your key in quotes.
api:
  encryption: 
    key: !secret encryption_key

## ------------ Allow Over-The-Air updates -------
ota:
  - platform: esphome
    password: !secret ota_password

## --------- WIFI Config ---------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "water barrel Fallback Hotspot"
    password: "MayCastle"
    ap_timeout: 10s

## ------- mDNS SETTINGS -------
## mDNS is a computer networking protocol that resolves hostnames to IP addresses within small networks that do not include a local name server.
## example: embinotec-weatherstation.local
mdns:
  disabled: false # Set to true to disable mDNS

## ------ WEB SERVER SETTINGS -------
## If webserver is activeted your weatherstation will be reachable in your browsers address bar http://<use_address>
#web_server:
#  port: 80

## ------- CAPTIVE PORTAL SETTINGS --------
## Works together with SUBSECTION wifi.ap
captive_portal:

## ------ WEB SERIAL --------
## Improve serial is a standard to connect by webserial and cable
improv_serial:

## ------ ESP32 Improve ------
## solid: The improv service is active and waiting to be authorized.
## blinking once per second: The improv service is awaiting credentials.
## blinking 3 times per second with a break in between: The identify command has been used by the client.
## blinking 5 times per second: Credentials are being verified and saved to the device.
## off: The improv service is not running.
esp32_improv:
  authorizer: user_button

## ------ NTP SERVER -------
## NTP Server to receive the time by NTP server.
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Berlin


## ------ STATUS LED --------
## The red status LED at the bottom side of the weather station shows the status of the system by pattern:
## OFF: everything is ok
## slow blink: Not connected, trying to connect.
## fast blink: Error
status_led:
  pin: GPIO13 ## esp32s3

## ------- POWER MANGEMENT -------
## ESP32 should be powered by lithium ion rechargeable 1000mAh.
## To save some power the ESP should not always be connected to your wifi and have some rest
## to cover the hole day with measurements.
deep_sleep:
  id: deep_sleep_1
  run_duration: 5min
  sleep_duration: ${update_interval_s}

## Example configuration with single pin wakeup on BK72xx
#deep_sleep:
#  wakeup_pin:  GPIO1 # CHARGE PIN will wakeup when P1 is high
#  wakeup_pin_mode: IGNORE # state of P8 at the moment of going to sleep does not influence the wakeup scenario

## Example configuration with multi-pin wakeup on BK72xx
#deep_sleep:
#  wakeup_pin:
#    - pin:
#        number: P8
#        inverted: True  # will wake up when P8 is low
#      wakeup_pin_mode: KEEP_AWAKE # will prevent sleep as long as P8 is low
#    - pin: P24 # will wake up when P24 goes high
#      wakeup_pin_mode: INVERT_WAKEUP # flips the trigger level after each wake



## ------ SENSOREN --------
sensor:
  - platform: ultrasonic
    #name: "Wasser Füllstand"
    trigger_pin: ${trigger}
    echo_pin: ${echo}
    id: sensor_to_water_cm
    update_interval: ${ultrasonic_sample_interval}
    unit_of_measurement: “m” 
    accuracy_decimals: 3
    #timeout (Optional, float): The number of meters for the timeout. Most sensors can only sense up to 2 meters. Defaults to 2 meters.
    #pulse_time (Optional, Time): The duration for which the trigger pin will be active. Defaults to 10us.
    #id (Optional, ID): Manually specify the ID used for code generation
    filters:
  # WICHTIG: der ultrasonic-Sensor liefert den Rohwert IMMER in Metern,
      # unabhängig von unit_of_measurement (das ist nur ein Label).
      # Deshalb hier explizit umrechnen + die gemessene Kalibrierung (Reflexion am Salz
      # statt an einer Referenzfläche) anwenden.

      - lambda: |-
          if (isnan(x)) return {};
          ESP_LOGD("log","value: %3.f",(x+${distance_calibration}) * 100.0);
          return (x + ${distance_calibration}) * 100.0;  // m -> cm, kalibriert
      
      # Glättet Rauschen/Ausreißer (Wellengang, Reflexionen) über mehrere
      # Rohmessungen, bevor der Wert an fill_height_cm weitergegeben wird.
      # send_first_at = window_size, damit nicht schon nach der ersten
      # Einzelmessung ein ungeglätteter Wert publiziert wird.
      - sliding_window_moving_average:
          window_size: ${moving_avg_window}
          send_every: ${moving_avg_window}
          send_first_at: ${moving_avg_window}
    on_value:
      - sensor.template.publish:
          id: fill_height_cm
          state: !lambda 'return ${distance_sensor_to_bottom} - x;'

## ------ Water Level in percent ------------
  - platform: template
    id: fill_height_cm
    name: "Water Level height"
    icon: "mdi:waves-arrow-up"
    update_interval: never
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    on_value:
      # Ampel-LED: rot = Mindestfüllhöhe erreicht/unterschritten (nachfüllen),
      # grün = voll (>= maximum_level), sonst gelb.
      - lambda: |-
          float r = 1.0, g = 1.0, b = 0.0;
          const float minimum_level = ${minimum_level};
          const float maximum_level = ${maximum_level};
          if (x <= minimum_level) {
            r = 1.0; g = 0.0;   // rot - leer / nachfüllen
          } else if (x >= maximum_level) {
            r = 0.0; g = 1.0;   // grün - voll
          } else {
            r = 1.0; g = 1.0;   // gelb - dazwischen
          }
          auto call = id(waterlevelindicatorled).turn_on();
          call.set_rgb(r, g, b);
          call.set_brightness(id(led_brightness));
          call.perform();

      - sensor.template.publish:
          id: waterlevelinpercent
          state: !lambda 'return (x / ${maximum_level}) * 100.0;'
      - sensor.template.publish:
          id: waterlevelinliters
          ## pi*r^2*h / 1000.0 ml
          state: !lambda 'return 3.14159265 * pow(${tank_radius_cm}, 2) * x / 1000.0;'

## ------ Water Level in percent ------------
  - platform: template
    id: waterlevelinpercent
    name: "Water Level"
    unit_of_measurement: "%"
    icon: "mdi:barrel-outline"
    accuracy_decimals: 0
    update_interval: never

## ------ Water Level in Liter ------------
  - platform: template
    id: waterlevelinliters
    name: "Water Level Liters"
    unit_of_measurement: "L"
    icon: "mdi:water"
    accuracy_decimals: 0
    update_interval: never

## --------- DIAGNOSTIC SENSORS ---------------
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: ${update_interval_wifi}
    device_class: signal_strength

  - platform: internal_temperature
    name: "MPU Temperatur"
    update_interval: 60s

## ------ LED HELLIGKEIT (einstellbar) ------------
## Speichert die aktuell gewählte Helligkeit (0.0-1.0) und übersteht einen Reboot.

 
number:
  - platform: template
    name: "LED Helligkeit"
    icon: "mdi:brightness-6"
    id: led_brightness_number
    min_value: ${min_brightness}
    max_value: ${max_brightness}
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 25
    unit_of_measurement: "/255"
    on_value:
      - lambda: |-
          // Number-Entity arbeitet in 0-255 (Byte-Skala), Light-API braucht 0.0-1.0.
          id(led_brightness) = x / 255.0;
      - light.turn_on:
          id: waterlevelindicatorled
          brightness: !lambda 'return id(led_brightness);'

## ------------- Example configuration entry ------------
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    pin: GPIO0
    num_leds: 1
    name: "water level indicator"
    id: waterlevelindicatorled
    

## ------ I2C SETTINGS ----------
## DO NOT CHANGE !!!
## I2C is an IC to IC connection to read for instance digital values from sensors.
#i2c:
#  - id: bus_a
#    sda: GPIO22
#    scl:
#      number: GPIO20
#    frequency: 100kHz

## ----- OUTPUT -----
output:
  - platform: gpio
    pin: GPIO2
    id: neopixel_power_gpio

## ----- SWITCH ---------
switch:
  - platform: output
    name: "Neopixel power bus"
    output: neopixel_power_gpio
    id: neopixel_power_switch
    restore_mode: ALWAYS_ON
    disabled_by_default: True

  - platform: template
    name: "Disable Deep Sleep"
    id: disable_sleep_switch
    optimistic: true
    turn_on_action:
      - logger.log: "Deep sleep disabled via switch"
      - deep_sleep.prevent: deep_sleep_1
    turn_off_action:
      - logger.log: "Deep sleep enabled via switch"
      - deep_sleep.allow: deep_sleep_1

## ------ USER BUTTON ------------
binary_sensor:
  - platform: gpio
    pin: GPIO38
    #name: "User button"
    id: user_button

## ----- Restart button -----
button:
  - platform: restart
    name: "MCU restart"

## ----- Wifi data ----- 
text_sensor:
  - platform: wifi_info
    ip_address:
      name: device/ip
    mac_address:
      name: device/mac
